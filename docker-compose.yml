services:
  attention-monitor:
    build: .
    container_name: attention_monitor_app
    restart: unless-stopped
    ports:
      # For real use, put an HTTPS reverse proxy (Caddy, nginx, Traefik) in front, bind to "127.0.0.1:3000:3000" instead
      # and set COOKIE_SECURE=true and TRUST_PROXY=1 in .env. See docs/self-hosting.md.
      - "3000:3000"
    volumes:
      # Keeps the data files outside the container. If it cannot write here (runs as uid 1000): sudo chown -R 1000:1000 ./data
      - ./data:/usr/src/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # Hardening: no new privileges, read-only filesystem, no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
